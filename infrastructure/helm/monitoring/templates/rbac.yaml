{{- if .Values.readers.enabled }}
{{- $sa := .Values.readers.serviceAccounts }}
# Alloy tails this namespace's pod logs through the API server (no host paths).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-log-reader
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-log-reader
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-log-reader
subjects:
  - kind: ServiceAccount
    name: {{ $sa.alloy }}
    namespace: {{ .Release.Namespace }}
---
# kube-state-metrics lists and watches exactly the kinds it reports (its --resources flag).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-state-reader
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [pods, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-state-reader
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-state-reader
subjects:
  - kind: ServiceAccount
    name: {{ $sa.kubeStateMetrics }}
    namespace: {{ .Release.Namespace }}
{{- end }}
