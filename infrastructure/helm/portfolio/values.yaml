# Safe defaults for the portfolio chart. No secrets belong here: credentials come from Secrets
# created out of band and referenced by name (`existingSecret`).
#
# Image references: set `digest` (preferred, `sha256:…`) or `tag`. Environment values files under
# `infrastructure/environments/*` pin digests; rendering fails if an image has neither.
#
# Resource numbers and the P7-02 load tests (docs/operations/load-testing.md): the API's classifier
# profile was set from measurements; PostgreSQL, Redis, cloudflared, and the worker were measured
# well inside theirs and kept. `api.resources` (rules only), migrations, and backups weren't
# measured and remain estimates.

nameOverride: ''
fullnameOverride: ''

imagePullPolicy: IfNotPresent
imagePullSecrets: []

api:
  image:
    repository: ghcr.io/example/portfolio-api
    tag: ''
    digest: ''
    # The 40-character commit the image was built from (set by the release workflow); labels the
    # workload's app.kubernetes.io/version, shown short by the Infrastructure Explorer.
    revision: ''
  replicaCount: 1
  # CPU-based HorizontalPodAutoscaler (P3-06). When enabled, replicaCount is ignored.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  port: 3001
  # Prometheus metrics (P7-01) on their own port, never in the Service or the tunnel. Off (the
  # default), they listen on the pod's loopback only: read them with `kubectl port-forward`.
  metricsPort: 9464
  metrics:
    # P9-04: listen on the pod's IP instead, with one NetworkPolicy rule letting only the
    # Prometheus pods below reach the port. Requires networkPolicy.enabled.
    scrape:
      enabled: false
      from:
        namespace: monitoring
        podLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/instance: prometheus
          app.kubernetes.io/component: server
  logLevel: log
  # Comma-separated browser origins allowed by CORS, e.g. https://portfolio.example.com. Leave
  # empty to supply CORS_ORIGINS through `envConfigMap` instead.
  corsOrigins: ''
  # Optional ConfigMap, created out of band, whose keys become environment variables. For values
  # that shouldn't live in Git, such as the real domain in CORS_ORIGINS.
  envConfigMap: ''
  # Optional Secret (e.g. unsealed from a SealedSecret) whose keys become environment variables.
  envSecret: ''
  # Use CF-Connecting-IP as the client address for chat quotas. Requires cloudflared.enabled and
  # networkPolicy.enabled, so the API is reachable only through the tunnel.
  trustCloudflareClientIp: false
  # Required when AI is enabled. Never put the secret key or a real hostname in public values.
  turnstile:
    existingSecret: ''
    secretKey: secret-key
    # Comma-separated exact site hostnames; can instead come from envConfigMap/envSecret as
    # TURNSTILE_HOSTNAMES (e.g. the existing sealed API environment Secret).
    hostnames: ''
    # Operator-verified destination CIDRs for challenges.cloudflare.com. With NetworkPolicies,
    # AI requires these; only TCP 443 is allowed. NetworkPolicy cannot filter hostname or URL.
    egressCidrs: []
  ai:
    enabled: false
    provider: ''
    # model and baseUrl can instead come from envConfigMap/envSecret as AI_MODEL and AI_BASE_URL,
    # to keep the reference deployment's model and address out of public values.
    model: ''
    baseUrl: ''
    # With networkPolicy.enabled, the only place the API may connect for inference (P5-06):
    # the runtime's address as a CIDR (e.g. <inference-host-ip>/32; NetworkPolicies match IPs,
    # not hostnames) and its TCP port. Required when AI and NetworkPolicies are both on.
    egress:
      cidr: ''
      port: 0
  # Visitor message screening (P5-08). `rules` is pattern matching only. `classifier` runs the
  # rules, then a CPU prompt-injection classifier baked into the API image, and (with AI enabled;
  # otherwise no model is loaded) the pod uses `classifierResources` instead of `resources`. P7-02
  # measured about 590 MiB per pod with the model loaded; the CPU request sets where the HPA
  # scales (70% of 250m, roughly 70-100 read requests a second per pod).
  messageGuard:
    mode: rules
    # Scores at or above this reject the message.
    threshold: 0.5
    # Longest a message waits for a score; past it the message is refused as busy (P7-08). 5 s
    # covers the heaviest message (~7 windows, ~2 s on the reference CPU) with room.
    timeoutMs: 5000
    classifierResources:
      requests:
        cpu: 250m
        memory: 640Mi
      limits:
        memory: 1Gi
  # Infrastructure Explorer snapshot (P6-01, P6-02). When enabled, the API runs as its own
  # service account bound to a namespaced, read-only Role (get/list on deployments, statefulsets,
  # and pods; nothing else), its token is mounted, and INFRASTRUCTURE_SOURCE=kubernetes. Off by
  # default: the endpoint then answers `infrastructure_disabled` and no token is mounted.
  infrastructure:
    enabled: false
    # Optional P6-03 source. Secret is mounted only in the API; token and TLS CA rotate in place.
    argocd:
      enabled: false
      serverUrl: https://argocd-server.argocd.svc
      application: portfolio
      project: portfolio
      existingSecret: ''
      tokenKey: token
      caKey: ca.crt
      namespace: argocd
      podLabels:
        app.kubernetes.io/name: argocd-server
      port: 8080
    # Egress to the Kubernetes API server, required with NetworkPolicies on. Pods reach it through
    # the `kubernetes` Service, which forwards to the node's address on the API server port, and
    # policies see that translated destination.
    apiServerEgress:
      cidr: ''
      port: 6443
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

worker:
  image:
    repository: ghcr.io/example/portfolio-worker
    tag: ''
    digest: ''
    revision: ''
  replicaCount: 1
  logLevel: log
  concurrency: 1
  # Time for the worker to finish its active job after SIGTERM.
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 192Mi

# One-shot `migrate` then `seed` using the API image. Runs as an Argo CD Sync hook after
# PostgreSQL (wave 0) and before the API and worker (wave 2).
migrations:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 192Mi

postgres:
  image:
    repository: docker.io/library/postgres
    tag: 17-alpine
    digest: ''
  database: portfolio
  user: portfolio
  auth:
    # Secret created out of band, e.g.
    #   kubectl -n portfolio create secret generic portfolio-postgres --from-literal=password=…
    # Use URL-safe characters only: the password is embedded in DATABASE_URL.
    existingSecret: portfolio-postgres
    passwordKey: password
  storage:
    size: 2Gi
    # Empty uses the cluster default (K3s: local-path).
    storageClassName: ''
  # Nightly pg_dump CronJob (P3-05). Dumps go to an existing host directory owned by uid/gid 70
  # (the postgres image user), mode 0700, outside the cluster's data directory.
  backup:
    enabled: false
    schedule: '17 3 * * *'
    hostPath: ''
    keepDaily: 7
    keepWeekly: 4
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  image:
    repository: docker.io/library/redis
    tag: 7-alpine
    digest: ''
  storage:
    size: 1Gi
    storageClassName: ''
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

cloudflared:
  # In-cluster connector for the dedicated Cloudflare Tunnel (P4-03). Its routes (the API hostname,
  # `^/api/v1/`, and a catch-all 404) live in the remotely managed tunnel configuration.
  enabled: false
  image:
    repository: docker.io/cloudflare/cloudflared
    tag: ''
    digest: ''
  replicaCount: 1
  # Secret created out of band holding the tunnel token under the key `token`.
  tokenSecret: portfolio-tunnel
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

# Phase 9 monitoring (docs/architecture/observability.md#least-privilege): read-only Roles in this
# namespace for the collectors running in the monitoring namespace. This chart grants them, so the
# portfolio AppProject keeps owning everything here and no ClusterRole is needed.
monitoring:
  readers:
    # P9-03: Alloy lists pods and reads their logs through the API server (no host paths).
    logs:
      enabled: false
      namespace: monitoring
      serviceAccount: alloy
    # P9-04: Prometheus discovers the API pods (list/watch pods), and kube-state-metrics lists
    # and watches the kinds it reports (restarts, Jobs, replicas, volumes).
    metrics:
      enabled: false
      namespace: monitoring
      prometheusServiceAccount: prometheus-server
      stateServiceAccount: kube-state-metrics

networkPolicy:
  # Default-deny for every pod in the namespace plus the explicit allows in
  # docs/architecture/networking.md.
  enabled: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
