{{- $fullname := include "portfolio.fullname" . }}
{{- $component := dict "root" $ "component" "api" }}
{{- if and .Values.api.trustCloudflareClientIp (not (and .Values.cloudflared.enabled .Values.networkPolicy.enabled)) }}
{{- fail "api.trustCloudflareClientIp requires cloudflared.enabled and networkPolicy.enabled (otherwise clients could forge CF-Connecting-IP)" }}
{{- end }}
{{- with .Values.api.metrics.scrape }}
{{- if and .enabled (not $.Values.networkPolicy.enabled) }}
{{- fail "api.metrics.scrape.enabled requires networkPolicy.enabled (otherwise every pod could read the metrics port)" }}
{{- end }}
{{- if and .enabled (not (and .from.namespace .from.podLabels)) }}
{{- fail "api.metrics.scrape.from.namespace and .podLabels are required" }}
{{- end }}
{{- end }}
{{- if not (has .Values.api.messageGuard.mode (list "rules" "classifier")) }}
{{- fail "api.messageGuard.mode must be rules or classifier" }}
{{- end }}
{{- if .Values.api.ai.enabled }}
{{- if not .Values.api.turnstile.existingSecret }}
{{- fail "api.turnstile.existingSecret is required when AI is enabled" }}
{{- end }}
{{- if not (or .Values.api.turnstile.hostnames .Values.api.envConfigMap .Values.api.envSecret) }}
{{- fail "api.turnstile.hostnames or an environment source for TURNSTILE_HOSTNAMES is required when AI is enabled" }}
{{- end }}
{{- if not (or .Values.api.ai.model .Values.api.envConfigMap .Values.api.envSecret) }}
{{- fail "api.ai.model or an environment source for AI_MODEL is required when AI is enabled" }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (not .Values.api.turnstile.egressCidrs) }}
{{- fail "api.turnstile.egressCidrs is required when AI and NetworkPolicies are enabled" }}
{{- end }}
{{- end }}
{{- with .Values.api.infrastructure }}
{{- if .argocd.enabled }}
{{- if not .enabled }}
{{- fail "api.infrastructure.argocd.enabled requires api.infrastructure.enabled" }}
{{- end }}
{{- if not (and .argocd.serverUrl .argocd.application .argocd.project .argocd.existingSecret .argocd.tokenKey .argocd.caKey) }}
{{- fail "api.infrastructure.argocd requires serverUrl, application, project, existingSecret, tokenKey, and caKey" }}
{{- end }}
{{- if and $.Values.networkPolicy.enabled (not (and .argocd.namespace .argocd.podLabels .argocd.port)) }}
{{- fail "api.infrastructure.argocd requires namespace, podLabels, and port for NetworkPolicies" }}
{{- end }}
{{- end }}
{{- if and .enabled $.Values.networkPolicy.enabled (not (and .apiServerEgress.cidr .apiServerEgress.port)) }}
{{- fail "api.infrastructure.apiServerEgress.cidr and .port are required when the infrastructure view and NetworkPolicies are enabled (otherwise the API can't reach the Kubernetes API server)" }}
{{- end }}
{{- end }}
{{- with .Values.api.ai }}
{{- if and .enabled $.Values.networkPolicy.enabled (not (and .egress.cidr .egress.port)) }}
{{- fail "api.ai.egress.cidr and api.ai.egress.port are required when AI and NetworkPolicies are enabled (otherwise the API can't reach the model)" }}
{{- end }}
{{- end }}
{{- with .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "portfolio.componentLabels" $component | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "portfolio.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portfolio.componentLabels" $component | nindent 8 }}
    spec:
      {{- if .infrastructure.enabled }}
      # Its own read-only account (api-rbac.yaml); the token is projected and rotated.
      serviceAccountName: {{ $fullname }}-api
      {{- end }}
      # The same truthiness as the blocks above, rendered as a literal boolean.
      automountServiceAccountToken: {{ if .infrastructure.enabled }}true{{ else }}false{{ end }}
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "portfolio.podSecurityContext" (include "portfolio.nodeUid" $) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "portfolio.image" .image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: {{ .logLevel | quote }}
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: {{ .port | quote }}
            # Set here so an envFrom source can't widen it (env wins over envFrom): loopback, or with
            # scraping on (P9-04) every pod interface, so `kubectl port-forward` (which connects to
            # the pod's loopback) still works while one NetworkPolicy rule opens the pod IP to
            # Prometheus alone. The pod never uses the host network (helm:check enforces it).
            - name: API_METRICS_HOST
              value: {{ ternary "0.0.0.0" "127.0.0.1" .metrics.scrape.enabled | quote }}
            - name: API_METRICS_PORT
              value: {{ .metricsPort | quote }}
            {{- include "portfolio.databaseEnv" $ | nindent 12 }}
            - name: REDIS_URL
              value: {{ include "portfolio.redisUrl" $ | quote }}
            {{- with .corsOrigins }}
            - name: CORS_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            - name: CHAT_TRUST_CF_CONNECTING_IP
              value: {{ .trustCloudflareClientIp | quote }}
            - name: CHAT_GUARD
              value: {{ .messageGuard.mode | quote }}
            {{- if eq .messageGuard.mode "classifier" }}
            - name: CHAT_GUARD_THRESHOLD
              value: {{ .messageGuard.threshold | quote }}
            - name: CHAT_GUARD_TIMEOUT_MS
              value: {{ .messageGuard.timeoutMs | quote }}
            {{- end }}
            {{- if .infrastructure.enabled }}
            - name: INFRASTRUCTURE_SOURCE
              value: kubernetes
            # The reader takes the token and the cluster CA from the mounted service account and
            # trusts that CA for its own requests only.
            - name: INFRASTRUCTURE_NAMESPACE
              value: {{ $.Release.Namespace | quote }}
            {{- end }}
            - name: AI_ENABLED
              value: {{ .ai.enabled | quote }}
            {{- if .infrastructure.argocd.enabled }}
            - name: ARGOCD_ENABLED
              value: 'true'
            - name: ARGOCD_SERVER_URL
              value: {{ .infrastructure.argocd.serverUrl | quote }}
            - name: ARGOCD_APPLICATION
              value: {{ .infrastructure.argocd.application | quote }}
            - name: ARGOCD_PROJECT
              value: {{ .infrastructure.argocd.project | quote }}
            - name: ARGOCD_TOKEN_FILE
              value: /var/run/secrets/argocd/token
            - name: ARGOCD_CA_FILE
              value: /var/run/secrets/argocd/ca.crt
            {{- end }}
            {{- if .ai.enabled }}
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .turnstile.existingSecret | quote }}
                  key: {{ required "api.turnstile.secretKey is required" .turnstile.secretKey | quote }}
            {{- with .turnstile.hostnames }}
            - name: TURNSTILE_HOSTNAMES
              value: {{ . | quote }}
            {{- end }}
            - name: AI_PROVIDER
              value: {{ required "api.ai.provider is required when AI is enabled" .ai.provider | quote }}
            {{- with .ai.model }}
            - name: AI_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .ai.baseUrl }}
            - name: AI_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- if or .envConfigMap .envSecret }}
          # Settings that don't belong in plain Git (e.g. CORS_ORIGINS with the real domain).
          envFrom:
            {{- with .envConfigMap }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- with .envSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          # Liveness and startup check only the process; readiness checks PostgreSQL and Redis,
          # so a dependency outage takes the pod out of rotation without restarting it.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml (and .ai.enabled (eq .messageGuard.mode "classifier") | ternary .messageGuard.classifierResources .resources) | nindent 12 }}
          securityContext:
            {{- include "portfolio.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .infrastructure.argocd.enabled }}
            - name: argocd-reader
              mountPath: /var/run/secrets/argocd
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- if .infrastructure.argocd.enabled }}
        - name: argocd-reader
          secret:
            secretName: {{ .infrastructure.argocd.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .infrastructure.argocd.tokenKey | quote }}
                path: token
              - key: {{ .infrastructure.argocd.caKey | quote }}
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "portfolio.componentLabels" $component | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "portfolio.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
{{- end }}
