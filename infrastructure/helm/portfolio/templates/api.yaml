{{- $fullname := include "portfolio.fullname" . }}
{{- $component := dict "root" $ "component" "api" }}
{{- if and .Values.api.trustCloudflareClientIp (not (and .Values.cloudflared.enabled .Values.networkPolicy.enabled)) }}
{{- fail "api.trustCloudflareClientIp requires cloudflared.enabled and networkPolicy.enabled (otherwise clients could forge CF-Connecting-IP)" }}
{{- end }}
{{- with .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "portfolio.componentLabels" $component | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "portfolio.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portfolio.componentLabels" $component | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "portfolio.podSecurityContext" (include "portfolio.nodeUid" $) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "portfolio.image" .image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: {{ .logLevel | quote }}
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: {{ .port | quote }}
            {{- include "portfolio.databaseEnv" $ | nindent 12 }}
            - name: REDIS_URL
              value: {{ include "portfolio.redisUrl" $ | quote }}
            {{- with .corsOrigins }}
            - name: CORS_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            - name: CHAT_TRUST_CF_CONNECTING_IP
              value: {{ .trustCloudflareClientIp | quote }}
            - name: AI_ENABLED
              value: {{ .ai.enabled | quote }}
            {{- if .ai.enabled }}
            - name: AI_PROVIDER
              value: {{ required "api.ai.provider is required when AI is enabled" .ai.provider | quote }}
            - name: AI_MODEL
              value: {{ required "api.ai.model is required when AI is enabled" .ai.model | quote }}
            {{- with .ai.baseUrl }}
            - name: AI_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- if or .envConfigMap .envSecret }}
          # Settings that don't belong in plain Git (e.g. CORS_ORIGINS with the real domain).
          envFrom:
            {{- with .envConfigMap }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- with .envSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          # Liveness and startup check only the process; readiness checks PostgreSQL and Redis,
          # so a dependency outage takes the pod out of rotation without restarting it.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            {{- include "portfolio.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "portfolio.componentLabels" $component | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "portfolio.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
{{- end }}
