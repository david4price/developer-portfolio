# kube-state-metrics v2.20.0 for portfolio and monitoring only
# (prometheus-community/kube-state-metrics 9.0.1). docs/architecture/observability.md#metrics
# Image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0 (index digest below).
image:
  sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
# Roles in each namespace come from the portfolio and monitoring charts, never a ClusterRole.
rbac:
  create: false
namespaces: portfolio,monitoring
collectors:
  - cronjobs
  - deployments
  - horizontalpodautoscalers
  - jobs
  - persistentvolumeclaims
  - pods
  - statefulsets
prometheusScrape: false
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
