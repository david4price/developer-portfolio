# Prometheus v3.16.0, server only (prometheus-community/prometheus 29.47.2).
# docs/architecture/observability.md#metrics
# Image: quay.io/prometheus/prometheus:v3.16.0 (multi-arch index digest below).
rbac:
  create: false
configmapReload:
  prometheus:
    enabled: false
server:
  image:
    digest: sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
  global:
    scrape_interval: 30s
    evaluation_interval: 1m
  retention: 30d
  retentionSize: 4GB
  statefulSet:
    enabled: true
  persistentVolume:
    size: 5Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
serviceAccounts:
  server:
    automountServiceAccountToken: true
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  # Each API replica on its metrics port, which no Service exposes (P9-04 opens it to this pod).
  portfolio-api:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [portfolio]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: api
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        replacement: $1:9464
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  kube-state-metrics:
    static_configs:
      - targets: [kube-state-metrics.monitoring.svc:8080]
  loki:
    static_configs:
      - targets: [loki.monitoring.svc:3100]
  alloy:
    static_configs:
      - targets: [alloy.monitoring.svc:12345]
