# Grafana 13.3.1, distroless (grafana-community/grafana 14.5.0). Tailnet-only, no public
# hostname; data sources from Git. docs/architecture/observability.md#grafana
# Image: docker.io/grafana/grafana:13.3.1-distroless (multi-arch index digest below).
# The admin Secret (grafana-admin) comes from secrets/grafana-admin.sealedsecret.yaml through the
# monitoring Application.
image:
  sha: 54e297ac67e2b72572f926892f4e06074dc4f79f2a56ed9a9ca9a88a46f28733
rbac:
  create: false
serviceAccount:
  automountServiceAccountToken: false
automountServiceAccountToken: false
testFramework:
  enabled: false
initChownData:
  enabled: false
# One pod on a ReadWriteOnce volume (SQLite): replace it, never run two.
deploymentStrategy:
  type: Recreate
persistence:
  enabled: true
  size: 1Gi
  # The volume holds alert state and sessions; Argo CD must never prune it.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
admin:
  existingSecret: grafana-admin
resources:
  requests:
    cpu: 25m
    memory: 192Mi
  limits:
    memory: 384Mi
grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
    feedback_links_enabled: false
  news:
    news_feed_enabled: false
  users:
    allow_sign_up: false
    allow_org_create: false
  auth.anonymous:
    enabled: false
  security:
    cookie_secure: true
    disable_gravatar: true
  snapshots:
    external_enabled: false
  public_dashboards:
    enabled: false
  # No plugin downloads from grafana.com at startup (Grafana preinstalls a few app plugins by
  # default). This setting is what stops them: today's NetworkPolicy only happens to block them
  # (with an error line each) until P9-06 opens HTTPS egress for alerts.
  plugins:
    preinstall_disabled: true
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        editable: false
        jsonData:
          # Every requestId in a log line links to the Logs dashboard filtered to that request,
          # over the last 7 days (widen the time picker for older ones; a 30-day default would
          # parse every log line Loki keeps). $$ keeps Grafana from reading ${…} as an
          # environment variable.
          derivedFields:
            - name: requestId
              matcherRegex: '"requestId":"([A-Za-z0-9._-]+)"'
              url: '/d/portfolio-logs/portfolio-logs?var-request_id=$${__value.raw}&from=now-7d&to=now'
              urlDisplayLabel: All log lines for this request
# P9-05: the dashboards from infrastructure/helm/monitoring/dashboards, as the monitoring chart's
# grafana-dashboards ConfigMap; read-only (UI saves disabled, deletion refused).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: portfolio
        orgId: 1
        folder: Portfolio
        type: file
        disableDeletion: true
        allowUiUpdates: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/portfolio
dashboardsConfigMaps:
  portfolio: grafana-dashboards
# P9-06: alert rules (the monitoring chart's grafana-alert-rules ConfigMap) and the contact point
# with its notification policy (the grafana-alerting SealedSecret; optional, so a fork without it
# still gets the rules, shown in Grafana only), in one read-only provisioning directory.
extraContainerVolumes:
  - name: alerting
    projected:
      sources:
        - configMap:
            name: grafana-alert-rules
        - secret:
            name: grafana-alerting
            optional: true
extraVolumeMounts:
  - name: alerting
    mountPath: /etc/grafana/provisioning/alerting
    readOnly: true
# Grafana reads alerting provisioning only at startup: this checksum of the rule files and the
# sealed contact point changes with them, so Argo CD restarts Grafana. pnpm helm:check fails when
# it is stale; the expected value is in its output.
podAnnotations:
  checksum/alerting: 563a2c9557657c4977b1e55a1b4a1a3216bbcc56e163bfa954cd47bb796e725a
