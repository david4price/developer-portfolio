# Loki 3.7.10, monolithic, filesystem storage, 30 days (grafana-community/loki 21.4.1).
# docs/architecture/observability.md#logs
# Image: docker.io/grafana/loki:3.7.10 (multi-arch index digest below).
deploymentMode: Monolithic
defaults:
  automountServiceAccountToken: false
loki:
  image:
    digest: sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: '2026-11-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false
# No RBAC at all: the rules sidecar (the only user of its ClusterRole, which reads every Secret)
# is off.
rbac:
  namespaced: true
sidecar:
  rules:
    enabled: false
serviceAccount:
  automountServiceAccountToken: false
singleBinary:
  replicas: 1
  sidecar: false
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
memberlist:
  service:
    publishNotReadyAddresses: false
