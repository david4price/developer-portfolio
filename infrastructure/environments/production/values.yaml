# Production overrides for the portfolio chart (owned by people; edit through pull requests).
# The api and worker image digests live in images.yaml, which the release workflow rewrites on
# every release from main. Don't edit images.yaml by hand.
api:
  # CORS_ORIGINS comes from the sealed Secret below (secrets/portfolio-api-env.sealedsecret.yaml),
  # so the domain stays out of plain Git.
  corsOrigins: ''
  envSecret: portfolio-api-env
  turnstile:
    existingSecret: portfolio-turnstile
    # Public anycast destinations resolved for challenges.cloudflare.com from the API pod.
    # Recheck on deployment; the chart enables this TCP 443 egress only when AI is enabled.
    egressCidrs:
      - 104.18.94.41/32
      - 104.18.95.41/32
  # Inference (P5-06). The model, its URL, and the assistant's name come from the sealed API
  # environment Secret (AI_MODEL, AI_BASE_URL, CHAT_ASSISTANT_NAME). Egress is Docker's default
  # bridge network, where the runtime publishes its port on the host side, limited to that port.
  ai:
    enabled: true
    provider: openai-compatible
    egress:
      cidr: 172.17.0.0/16
      port: 12434
  # 1-3 replicas on one node; chat limits live in Redis, so they hold across replicas.
  autoscaling:
    enabled: true
  # Every request arrives through the tunnel (only cloudflared may reach the API).
  trustCloudflareClientIp: true
  # Rules, then the CPU injection classifier baked into the API image (P5-08). The pod switches
  # to messageGuard.classifierResources (896Mi request, 1280Mi limit) for the model.
  messageGuard:
    mode: classifier
postgres:
  backup:
    enabled: true
    # Created once by the owner: install -d -o 70 -g 70 -m 700 /srv/portfolio-backups/postgres
    hostPath: /srv/portfolio-backups/postgres
  image:
    # postgres:17-alpine, multi-arch index digest
    digest: sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
redis:
  image:
    # redis:7-alpine, multi-arch index digest
    digest: sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
cloudflared:
  enabled: true
  image:
    # cloudflare/cloudflared:2026.10.7, multi-arch index digest
    digest: sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
