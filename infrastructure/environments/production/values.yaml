# Production overrides for the portfolio chart (owned by people; edit through pull requests).
# The api and worker image digests live in images.yaml, which the release workflow rewrites on
# every release from main. Don't edit images.yaml by hand.
api:
  # CORS_ORIGINS comes from the out-of-band ConfigMap below, so the domain stays out of Git.
  corsOrigins: ''
  envConfigMap: portfolio-api-public
  # Every request arrives through the tunnel (only cloudflared may reach the API).
  trustCloudflareClientIp: true
postgres:
  image:
    # postgres:17-alpine, multi-arch index digest
    digest: sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
redis:
  image:
    # redis:7-alpine, multi-arch index digest
    digest: sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
cloudflared:
  enabled: true
  image:
    # cloudflare/cloudflared:2026.10.7, multi-arch index digest
    digest: sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
