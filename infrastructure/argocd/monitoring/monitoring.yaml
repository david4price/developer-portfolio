# The repository's own monitoring manifests: NetworkPolicies, the collectors' Roles, and Grafana's
# dashboards; plus the namespace's SealedSecrets (ADR 0001): Grafana's admin password (P9-05), and
# the alert contact point (P9-06).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  # No resources finalizer: deleting the Application leaves everything in place.
spec:
  project: monitoring
  sources:
    - repoURL: https://github.com/david4price/developer-portfolio.git
      targetRevision: main
      path: infrastructure/helm/monitoring
      helm:
        releaseName: monitoring
        valueFiles:
          - ../../environments/production/monitoring/monitoring.yaml
    # The controller unseals these into the Secrets Grafana references.
    - repoURL: https://github.com/david4price/developer-portfolio.git
      targetRevision: main
      path: infrastructure/environments/production/monitoring/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
