# Grafana: dashboards, log search, and alerts; tailnet-only (docs/architecture/observability.md#grafana).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    # sha256 of the chart archive at this version; pnpm helm:check verifies it before rendering.
    developer-portfolio/chart-sha256: e243e77eba1bf3078e6adc0979d694c0e00b998e07875cfb7800a7f5fb69c245
  # No resources finalizer: deleting the Application leaves the workloads and volumes in place.
spec:
  project: monitoring
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.5.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/infrastructure/environments/production/monitoring/grafana.yaml
    - repoURL: https://github.com/david4price/developer-portfolio.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
