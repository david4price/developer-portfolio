# Least-privilege project: one repository, one namespace, no cluster-scoped resources, and only
# the kinds the chart renders. Plain Secrets are deliberately absent: they arrive as SealedSecrets
# (ADR 0001) and the controller creates the Secrets.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portfolio
  namespace: argocd
spec:
  description: Developer portfolio (api, worker, PostgreSQL, Redis)
  sourceRepos:
    - https://github.com/david4price/developer-portfolio.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: portfolio
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: bitnami.com
      kind: SealedSecret
