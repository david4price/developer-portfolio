# Sealed Secrets controller (ADR 0001, P3-08). Chart and image pinned; automatic key renewal off,
# so the one backed-up key keeps working (rotate by hand, see the ADR).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  # No resources finalizer: deleting the Application must never take the CRD (and with it every
  # SealedSecret) down.
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # The name kubeseal looks for by default.
        fullnameOverride: sealed-secrets-controller
        image:
          # 0.41.2, multi-arch index digest
          tag: 0.41.2@sha256:e63ec6ec2b12a471bf781081bd370a93ca7b7b3999e5b9243341379aeb801d0b
        keyrenewperiod: '0'
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # Never prune the controller's resources automatically (the CRD carries every SealedSecret).
      prune: false
      selfHeal: true
