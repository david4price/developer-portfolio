# P7-02: temporary objects for an in-cluster read-path load test. Applied by hand, never through
# Argo CD; remove everything with `kubectl delete -f cluster.yaml` (deleting the namespace alone
# stops the load at once). The scripts come from a ConfigMap:
#   kubectl -n loadtest create configmap k6-scripts --from-file=read-path.js
apiVersion: v1
kind: Namespace
metadata:
  name: loadtest
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The API admits only cloudflared; this lets the load generator in, on the API port only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loadtest-to-api
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: portfolio
      app.kubernetes.io/name: portfolio
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loadtest
          podSelector:
            matchLabels:
              app: k6
      ports:
        - protocol: TCP
          port: 3001
---
apiVersion: v1
kind: Pod
metadata:
  name: k6
  namespace: loadtest
  labels:
    app: k6
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  # Idles; each load step runs with `kubectl exec` so every rate gets its own summary.
  activeDeadlineSeconds: 3600
  securityContext:
    runAsNonRoot: true
    runAsUser: 12345
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: k6
      image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
      command: [sh, -c, 'sleep 3600']
      resources:
        requests:
          cpu: 250m
          memory: 128Mi
        limits:
          # Capped so the generator can't crowd the shared node.
          cpu: '1'
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: scripts
      configMap:
        name: k6-scripts
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
