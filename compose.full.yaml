# Fully containerized stack: dependencies, one-shot migrate + seed, API, worker, static web.
#   docker compose -f compose.full.yaml up -d --build
include:
  - compose.yaml

x-node-service: &node-service
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  migrate:
    <<: *node-service
    build: &api-build
      context: .
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        APP: api
    command: [node, dist/database/migrate.js]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    <<: *node-service
    build: *api-build
    command: [node, dist/database/seed.js]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    <<: *node-service
    build: *api-build
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-log}
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      AI_ENABLED: 'false'
    ports:
      - 127.0.0.1:${API_PORT:-3001}:3001
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *node-service
    build:
      context: .
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        APP: worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-log}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
    environment:
      API_ORIGIN: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:8080
    # Not read-only: the nginx entrypoint renders the config template into /etc/nginx/conf.d.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
