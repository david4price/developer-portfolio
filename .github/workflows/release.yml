name: Release

# Runs after CI succeeds on a push to main: builds the api and worker images, pushes them to GHCR,
# and commits their digests to infrastructure/environments/production/images.yaml. Argo CD deploys
# whatever that file pins, so a deployment only ever runs images built from main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# One release at a time, in order; a newer run waits instead of racing an older one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/node-service.Dockerfile
          build-args: APP=api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/portfolio-api:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      - name: Build and push worker
        id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/node-service.Dockerfile
          build-args: APP=worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/portfolio-worker:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

  pin:
    name: Commit digests to production values
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Write images.yaml
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          API_DIGEST: ${{ needs.images.outputs.api }}
          WORKER_DIGEST: ${{ needs.images.outputs.worker }}
        run: |
          set -euo pipefail
          file=infrastructure/environments/production/images.yaml
          for digest in "$API_DIGEST" "$WORKER_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "bad digest: $digest" >&2; exit 1; }
          done
          # Never move production backwards: skip if the pinned build is newer than this one.
          if [[ -f "$file" ]]; then
            pinned="$(sed -n 's/^# source-commit: \([0-9a-f]\{40\}\)$/\1/p' "$file")"
            if [[ -n "$pinned" ]] && ! git merge-base --is-ancestor "$pinned" "$SOURCE_SHA"; then
              echo "images.yaml already pins $pinned, which is not an ancestor of $SOURCE_SHA; skipping."
              exit 0
            fi
          fi
          owner="${OWNER,,}"
          cat > "$file" <<EOF
          # Generated by .github/workflows/release.yml. Don't edit by hand.
          # source-commit: ${SOURCE_SHA}
          api:
            image:
              repository: ghcr.io/${owner}/portfolio-api
              digest: ${API_DIGEST}
          worker:
            image:
              repository: ghcr.io/${owner}/portfolio-worker
              digest: ${WORKER_DIGEST}
          EOF
      - name: Commit and push
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git add infrastructure/environments/production/images.yaml
          if git diff --cached --quiet; then
            echo "No digest change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release): pin images for ${SOURCE_SHA::7}"
          # Commits pushed with GITHUB_TOKEN don't trigger CI, so this can't loop.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
