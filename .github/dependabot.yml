# Security fixes only (owner's choice, 2026-11-19). Routine version PRs are off
# (`open-pull-requests-limit: 0`); Dependabot alerts and security updates, enabled in the
# repository's settings, still open a PR when a dependency has a known vulnerability (CI only
# checks package signatures). Versions are otherwise updated deliberately, not on a schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      # typescript-eslint supports TypeScript < 6.1; TS 7 is roadmap task P7-05.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types must match the runtime: Node 24 (.node-version, engines).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
