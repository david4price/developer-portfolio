# Security fixes only (ADR 0002, docs/architecture/adr-0002-dependency-updates.md). Routine
# version PRs are off (`open-pull-requests-limit: 0`). Dependabot alerts and security updates,
# enabled in the repository's settings, still open a PR when an npm package or a GitHub Action
# has a known vulnerability. Docker isn't covered by security updates (see the ADR), and there
# are no ignore rules, because they would now only hold back security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
